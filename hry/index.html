* { box-sizing:border-box; }

.mono { font-family:Consolas,Menlo,monospace; }
a { color:var(--accent); text-decoration:none; }

input[type=text] { min-width:200px; }
button { background:var(--panel2); color:var(--text); border:1px solid var(--line);

  font-family:Verdana,sans-serif; font-size:.8rem; }
button:hover { border-color:var(--accent); }
table { border-collapse:collapse; width:100%; margin:12px 0; font-size:.92rem; }
th { text-align:left; font-family:Verdana,sans-serif; font-size:.72rem; text-transform:uppercase;
  letter-spacing:.06em; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line); }
td { padding:7px 10px; border-bottom:1px solid #2a2b30; vertical-align:top; }
tr:hover td { background:#222327; }
.badge { display:inline-block; font-family:Verdana,sans-serif; font-size:.65rem; padding:1px 7px;
  border:1px solid var(--line); border-radius:8px; color:var(--muted); }
.badge.new { border-color:var(--accent); color:var(--accent); }
.fac-chip { display:inline-block; font-family:Verdana,sans-serif; font-size:.72rem;

.deck { font-family:Verdana,sans-serif; font-size:.78rem; }
.win { color:var(--gold); font-weight:bold; }
.side { font-family:Verdana,sans-serif; font-size:.7rem; color:var(--muted);

kind":"full","seed":19,"rounds":3,"winner":"A","lives":{"A":1,"B":0},"a":{"player":"GLM 5.3 Flash (Z3-mágové-znamení)","fac":"ZA","deck":"Z3-mágové-znamení","leader":"Velitel – Hrad Stygga"},"b":{"player":"GLM 5.3 Flash (Z2-Vlk-nástup)","fac":"ZA","deck":"Z2-Vlk-nástup","leader":"Velitel – Hrad Stygga"}},{"id":"v14-selfplay-ZA-seed2","href":"v14-selfplay-ZA-seed2.html","src":"selfplay-v14","kind":"full","seed":2,"rounds":3,"winner":"B","lives":{"A":0,"B":1},"a":{"player":"GLM 5.3 Flash (Z3-mágové-znamení)","fac":"ZA","deck":"Z3-mágové-znamení","leader":"Velitel – Hrad Stygga"},"b":{"player":"GLM 5.3 Flash (Z2-Vlk-nástup)","fac":"ZA","deck":"Z2-Vlk-nástup","leader":"Velitel – Hrad Stygga"}},{"id":"v14-selfplay-ZA-seed20","href":"v14-selfplay-ZA-seed20.html","src":"selfplay-v14","kind":"full","seed":20,"rounds":3,"winner":"B","lives":{"A":0,"B":1},"a":{"player":"GLM 5.3 Flash (Z3-mágové-znamení)","fac":"ZA","deck":"Z3-mágové-znamení","leader":"Velitel – Hrad Stygga"},"b":{"player":"GLM 5.3 Flash (Z2-Vlk-nástup)","fac":"ZA","deck":"Z2-Vlk-nástup","leader":"Velitel – Hrad Stygga"}},{"id":"v14-selfplay-ZA-seed3","href":"v14-selfplay-ZA-seed3.html","src":"selfplay-v14","kind":"full","seed":3,"rounds":2,"winner":"A","lives":{"A":2,"B":0},"a":{"player":"GLM 5.3 Flash (Z3-mágové-znamení)","fac":"ZA","deck":"Z3-mágové-znamení","leader":"Velitel – Hrad Stygga"},"b":{"player":"GLM 5.3 Flash (Z2-Vlk-nástup)","fac":"ZA","deck":"Z2-Vlk-nástup","leader":"Velitel – Hrad Stygga"}},{"id":"v14-selfplay-ZA-seed4","href":"v14-selfplay-ZA-seed4.html","src":"selfplay-v14","kind":"full","seed":4,"rounds":3,"winner":"B","lives":{"A":0,"B":1},"a":{"player":"GLM 5.3 Flash (Z3-mágové-znamení)","fac":"ZA","deck":"Z3-mágové-znamení","leader":"Velitel – Hrad Stygga"},"b":{"player":"GLM 5.3 Flash (Z2-Vlk-nástup)","fac":"ZA","deck":"Z2-Vlk-nástup","leader":"Velitel – Hrad Stygga"}},{"id":"v14-selfplay-ZA-seed5","href":"v14-selfplay-ZA-seed5.html","src":"selfplay-v14","kind":"full","seed":5,"rounds": <script>
(function () {
  var CAT = JSON.parse(document.getElementById('catalog').textContent);
  var FACL = {SO:"Skellige",SK:"Severní království",NG:"Nilfgaard",ST:"Scoia'tael",MO:"Monstra",ZA:"Zaklínači"};
  var FACC = {SO:"#b8342f",SK:"#c89b3c",NG:"#3f6296",ST:"#4e7a3f",MO:"#7a2fa0",ZA:"#a8834b"};
  var FACS = ["SO","SK","NG","ST","MO","ZA"];
  var SRCL = {selfplay:"GLM self-play","selfplay-v14":"v14 LLM-first","selfplay-v13":"v13 auto-tempo","selfplay-v11":"v11",run:"běh",turnaj:"turnaj",k4:"k4 sampionát"};
  var KINDL = {full:"plný",parsed:"z logu"};
  var st = {facs:new Set(), vs:"", deckA:"", deckB:"", winner:"", q:"", sort:"fac"};

  function esc(s){ if(s==null) return ""; return String(s).replace(/&/g,"&amp;")
    .replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  // facs = množina povolených frakcí (hra musí mít alespoň jednu stranu v ní);
  // vs/deck/odeck = daná frakce/balíček musí figurovat na kterékoliv straně,
  // takže filtry fungují i na mirrory a lze je kombinovat (MO × NG, M1 × M4…).
  function passes(e, skipFacs){
    if (!skipFacs && st.facs.size && !(st.facs.has(e.a.fac) || st.facs.has(e.b.fac))) return false;
    if (st.vs && !(e.a.fac===st.vs || e.b.fac===st.vs)) return false;
    if (st.deckA && !(e.a.deck===st.deckA || e.b.deck===st.deckA)) return false;
    if (st.deckB && !(e.a.deck===st.deckB || e.b.deck===st.deckB)) return false;
    if (st.winner && e.winner!==st.winner) return false;
    if (st.q){
      var hay = [e.id,e.a.player,e.b.player,e.a.deck,e.b.deck,e.a.leader,e.b.leader]
        .map(function(x){return (x||"").toLowerCase();}).join(" ");
      if (hay.indexOf(st.q.toLowerCase())<0) return false;
    }
    return true;
  }

  function seedNum(e){ var v = (e.seed!=null) ? e.seed : (e.id||"");
    var m = String(v).match(/(\d+)\s*$/); return m ? +m[1] : 0; }
  function cmp(e1,e2){
    if (st.sort==="seed") return seedNum(e1)-seedNum(e2) || (e1.id<e2.id?-1:e1.id>e2.id?1:0);
    var k1=FACL[e1.a.fac]+FACL[e1.b.fac], k2=FACL[e2.a.fac]+FACL[e2.b.fac];
    return k1<k2?-1:k1>k2?1:seedNum(e1)-seedNum(e2);
  }

  function facChip(f){ return '<span class="fac-chip" style="background:'+(FACC[f]||"#555")+'">'+esc(f)+'</span>'; }
  function sideCell(e,s){
    var p=e[s];
    var html='<span class="side">'+s.toUpperCase()+'</span>'+facChip(p.fac)
      +' <span class="deck">'+esc(p.deck||"?")+'</span>';
    var win = e.winner ? (e.winner===s.toUpperCase()) : null;
    if (win) html='<td>'+html.replace('<span class="side">','<span class="side win">');
    else html='<td>'+html;
    var sub=[];
    if (p.player) sub.push(esc(p.player));
    if (p.leader) sub.push(esc(p.leader));
    if (sub.length) html+='<br><span class="meta">'+sub.join(" · ")+'</span>';
    return html+'</td>';
  }
  function row(e){
    var res;
    if (e.games!=null){
      res='<td class="meta">'+e.games+' partií'+(e.wins!=null?' · kandidát '+e.wins+'×':'')+'</td>';
    } else {
      res='<td>'+(e.winner?'<b class="win">'+e.winner+'</b>':'—')
        +(e.lives?' '+e.lives.A+':'+e.lives.B:'')+'</td>';
    }
    return '<tr><td><a href="'+esc(e.href)+'">'+esc(e.id)+'</a></td>'
      +'<td><span class="badge'+(e.src==="selfplay"?' new':'')+'">'+esc(SRCL[e.src]||e.src)+'</span></td>'
      +sideCell(e,'a')+res+sideCell(e,'b')
      +'<td>'+(e.rounds!=null?e.rounds:'—')+'</td>'
      +'<td><span class="badge'+(e.kind==="full"?' new':'')+'">'+esc(KINDL[e.kind]||e.kind)+'</span></td></tr>';
  }

  var facsEl=document.getElementById("facs"),
      vsSel=document.getElementById("vs"),
      deckASel=document.getElementById("deckA"),
      deckBSel=document.getElementById("deckB"),
      winSel=document.getElementById("winner"),
      sortSel=document.getElementById("sort"),
      qEl=document.getElementById("q"),
      resetEl=document.getElementById("reset"),
      countEl=document.getElementById("count"),
      tbody=document.querySelector("#tbl tbody");

  function facCount(f){ var n=0;
    for (var i=0;i<CAT.length;i++){ var e=CAT[i];
      if ((e.a.fac===f||e.b.fac===f) && passes(e,true)) n++; }
    return n; }
  function buildChips(){
    facsEl.innerHTML="";
    FACS.forEach(function(f){
      var c=document.createElement("span");
      c.className="chip"+(st.facs.has(f)?" on":"");
      c.style.background=FACC[f];
      c.textContent=FACL[f]+" ("+facCount(f)+")";
      c.onclick=function(){ if(st.facs.has(f)) st.facs.delete(f); else st.facs.add(f); apply(); };
      facsEl.appendChild(c);
    });
  }
  function populateDecks(sel){
    var names={};
    CAT.forEach(function(e){ ["a","b"].forEach(function(s){ if(e[s].deck) names[e[s].deck]=1; }); });
    sel.innerHTML='<option value="">—</option>'
      +Object.keys(names).sort().map(function(n){return '<option value="'+esc(n)+'">'+esc(n)+'</option>';}).join("");
  }

  var qid=0, CHUNK=400;
  function render(list){
    qid++; var my=qid, i=0;
    function step(){
      if (my!==qid) return;
      var j=Math.min(i+CHUNK, list.length), s="";
      for (; i<j; i++) s+=row(list[i]);
      tbody.insertAdjacentHTML("beforeend", s);
      countEl.textContent="Zobrazuji "+list.length+" z "+CAT.length+" her";
      if (i<list.length) requestAnimationFrame(step);
    }
    tbody.innerHTML=""; step();
  }

  function saveHash(){
    var h=[];
    if (st.facs.size) h.push("fac="+Array.from(st.facs).join(","));
    if (st.vs) h.push("vs="+encodeURIComponent(st.vs));
    if (st.deckA) h.push("deck="+encodeURIComponent(st.deckA));
    if (st.deckB) h.push("odeck="+encodeURIComponent(st.deckB));
    if (st.winner) h.push("win="+st.winner);
    if (st.q) h.push("q="+encodeURIComponent(st.q));
    if (st.sort!=="fac") h.push("sort="+st.sort);
    history.replaceState(null,"","#"+h.join("&"));
  }
  function loadHash(){
    if (!location.hash || location.hash.length<2) return;
    location.hash.slice(1).split("&").forEach(function(kv){
      var i=kv.indexOf("="); if(i<0) return;
      var k=kv.slice(0,i), v=decodeURIComponent(kv.slice(i+1));
      if (k==="fac") v.split(",").forEach(function(f){ if(FACL[f]) st.facs.add(f); });
      else if (k==="vs") st.vs=v;
      else if (k==="deck") st.deckA=v;
      else if (k==="odeck") st.deckB=v;
      else if (k==="win") st.winner=v;
      else if (k==="q") st.q=v;
      else if (k==="sort") st.sort=v;
    });
  }

  function apply(){
    buildChips();
    var list=CAT.filter(function(e){return passes(e,false);});
    list.sort(cmp);
    saveHash();
    render(list);
  }

  FACS.forEach(function(f){ var o=document.createElement("option");
    o.value=f; o.textContent=FACL[f]; vsSel.appendChild(o); });
  populateDecks(deckASel); populateDecks(deckBSel);
  loadHash();
  vsSel.value=st.vs; deckASel.value=st.deckA; deckBSel.value=st.deckB;
  winSel.value=st.winner; sortSel.value=st.sort; qEl.value=st.q;

  vsSel.onchange=function(){ st.vs=vsSel.value; apply(); };
  deckASel.onchange=function(){ st.deckA=deckASel.value; apply(); };
  deckBSel.onchange=function(){ st.deckB=deckBSel.value; apply(); };
  winSel.onchange=function(){ st.winner=winSel.value; apply(); };
  sortSel.onchange=function(){ st.sort=sortSel.value; apply(); };
  var qt; qEl.addEventListener("input", function(){
    clearTimeout(qt); qt=setTimeout(function(){ st.q=qEl.value.trim(); apply(); },150); });
  resetEl.onclick=function(){
    st={facs:new Set(), vs:"", deckA:"", deckB:"", winner:"", q:"", sort:"fac"};
    vsSel.value=""; deckASel.value=""; deckBSel.value=""; winSel.value="";
    sortSel.value="fac"; qEl.value=""; apply();
  };
  apply();
})();
</script>
