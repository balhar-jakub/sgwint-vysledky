<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Přehrávání — U4-povzbuzení-specialky [Skellige] × Skellige [U2-výměna]</title>
<style>
:root { --bg:#141416; --panel:#1d1e21; --panel2:#242529; --line:#3a3b40;
  --text:#e8e6e0; --muted:#9a978f; --accent:#d4a253; --gold:#e2b93b;
  --good:#7ec16f; --bad:#d47f7f; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text);
  font:16px/1.5 Georgia,'Times New Roman',serif; }
.mono { font-family:Consolas,Menlo,monospace; }
.meta { color:var(--muted); font-size:.85rem; font-family:Verdana,sans-serif; }
.wrap { max-width:1100px; margin:0 auto; padding:16px 20px 60px; }
h1 { font-size:1.3rem; margin:.6em 0; }
.scorebar { display:flex; justify-content:space-between; align-items:center; gap:12px;
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:10px 16px; margin:12px 0; flex-wrap:wrap; font-family:Verdana,sans-serif; }
.scorebar .names { font-size:.95rem; }
.scorebar .big { font-size:1.5rem; font-weight:bold; font-variant-numeric:tabular-nums; }
.sidebox { border:1px solid var(--line); border-radius:10px; margin:8px 0; overflow:hidden; }
.sidebox .hdr { padding:6px 12px; font-family:Verdana,sans-serif; font-size:.78rem;
  letter-spacing:.04em; text-transform:uppercase; color:var(--muted);
  display:flex; justify-content:space-between; }
.rowline { display:flex; align-items:center; gap:8px; padding:5px 12px;
  border-top:1px solid #2a2b30; min-height:34px; flex-wrap:wrap; }
.rowline .rname { width:74px; font-size:.75rem; color:var(--muted);
  font-family:Verdana,sans-serif; flex:0 0 auto; }
.rowline .rweath { color:#7fb3d4; font-size:.8rem; }
.rowline .rscore { margin-left:auto; font-variant-numeric:tabular-nums;
  font-weight:bold; color:var(--accent); }
.cards { display:flex; gap:4px; flex-wrap:wrap; }
.cpill { display:inline-block; background:var(--panel2); border:1px solid var(--line);
  border-radius:6px; padding:2px 8px; font-size:.82rem; font-family:Verdana,sans-serif;
  white-space:nowrap; cursor:default; }
.cpill .pw { color:var(--gold); font-weight:bold; margin-left:4px; }
.cpill.shield { border-color:#7fb3d4; }
.cpill.back { background:#181820; color:var(--muted); font-style:italic; }
.cpill.last { border-color:var(--gold); box-shadow:0 0 0 1px var(--gold), 0 0 10px rgba(226,185,59,.45); }
.cpill.last .lmark { color:var(--gold); margin-left:4px; font-size:.7rem; }
.cpill .kw { margin-left:3px; font-size:.72rem; cursor:help; }
.cpill .kw.under { color:#e0894a; font-weight:bold; }
.cpill .kw.guard { color:#7fb3d4; }
.cpill.hero { border-color:var(--accent); }
.ctrls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:14px 0;
  font-family:Verdana,sans-serif; }
button { background:var(--panel2); color:var(--text); border:1px solid var(--line);
  border-radius:8px; padding:6px 14px; font-size:.9rem; cursor:pointer; }
button:hover { border-color:var(--accent); }
button.on { border-color:var(--accent); color:var(--accent); }
.tl { height:14px; background:var(--panel); border:1px solid var(--line);
  border-radius:7px; position:relative; cursor:pointer; flex:1 1 240px; min-width:200px; }
.tl .knob { position:absolute; top:-4px; width:10px; height:20px; background:var(--accent);
  border-radius:3px; margin-left:-5px; }
.tl .tick { position:absolute; top:4px; width:2px; height:6px; background:#4a4b52; }
.log { background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:10px 14px; margin-top:10px; max-height:220px; overflow-y:auto;
  font-family:Consolas,Menlo,monospace; font-size:.8rem; }
.log div { padding:1px 0; color:var(--muted); }
.log div.cur { color:var(--text); }
.log div.roundend { color:var(--accent); }
.llm { color:var(--gold); font-family:Verdana,sans-serif; font-size:.72rem; cursor:help; }
.drv { color:var(--muted); font-family:Verdana,sans-serif; font-size:.72rem; cursor:help; }
.persp { font-size:.8rem; color:var(--muted); }
.sidechip { background:var(--panel2); border:1px solid var(--accent); border-radius:4px;
  padding:0 6px; font-size:.72rem; font-weight:bold; color:var(--accent);
  font-family:Verdana,sans-serif; margin:0 4px; }
</style>
</head>

    if (lastMark) cls += lastMark;
    var effdiff = (card.eff !== undefined && card.eff !== card.power) ? ' title="'+esc(tt)+' ['+card.eff+'/'+card.power+']"'
                                            : ' title="'+esc(tt)+'"';
    // klíčová slova na kartě (Jakub 31. 10. 2026): povzbuzení ✨, léčitel ✚, sežrání 👄, špeh 🕵, ochránce ⛨
    // (štít = ⛨, štít karty zůstává 🛡 — vizuálně odlišné; 31. 10. 2026)
    var kw = '';
    if (card['povzbuzení'] || (ci && ci.kw && ci.kw.indexOf('povzbuzení') >= 0)) kw += '<span class="kw" title="povzbuzení: +1 ostatním jednotkám v řadě">✨</span>';
    if (card['léčitel'] || (ci && ci.kw && ci.kw.indexOf('léčitel') >= 0))   kw += '<span class="kw" title="léčitel: vynese jednotku z pohřebiště">✚</span>';
    if (card['sežrání'] || (ci && ci.kw && ci.kw.indexOf('sežrání') >= 0))   kw += '<span class="kw" title="sežrání: sežere cílovou jednotku, získá její sílu">👄</span>';
    if (card['špeh'] || (ci && ci.kw && ci.kw.indexOf('špeh') >= 0))      kw += '<span class="kw" title="špeh: vynáší se na soupeřovu stranu, lízneš 1 kartu">🕵</span>';
    if (card['ochránce'] || (ci && ci.kw && ci.kw.indexOf('ochránce') >= 0)) kw += '<span class="kw guard" title="ochránce: chrání sousední jednotky před zničením">⛨</span>';
    if (card.under && card.under.length)
      kw += '<span class="kw under" title="sežráno pod kartou: '+esc(card.under.join(', '))+'">🍖'+card.under.length+'</span>';
    return '<span class="'+cls+'"'+effdiff+'>'+esc(card.name)+pw+(shield?' 🛡':'')+kw+(lastMark?'<span class="lmark">▶</span>':'')+'</span>';
  }

  // naposledy zahraná karta v aktuálním kroku — zlatě označená na desce.
  // Preferujeme deploy (nese to_side + row → špeh hraný A leží na desce B);
  // turn jen jako fallback u starších záznamů bez deploy eventu.
  function lastPlayed() {
    var out = null;
    (evByT[ts[T]] || []).forEach(function(ev){
      if (ev.type === 'deploy' && ev.card) out = {side: ev.to_side || ev.side, card: ev.card, row: ev.row || null};
      else if (ev.type === 'turn' && ev.side && ev.card && !out) out = {side: ev.side, card: ev.card, row: ev.row || null};
    });
    return out;
  }
  function isLastPlayed(name, side, row) {
    var lp = lastPlayed();
    if (!lp) return false;
    // špeh hraný A leží na desce B — lp.side je CÍLOVÁ strana desky (to_side), ne hráč
    if (lp.side && lp.side !== side) return false;
    if (lp.row && row && lp.row !== row) return false;
    // označ všechny kopie stejného jména v cílové řadě — jinač nejde poznat, která z nich
    return lp.card === name;
  }

  function render() {
    var t = ts[T];
    var sn = D.snapshots[t] || {board:{A:{},B:{}}, hand:{A:[],B:[]}, score:{A:0,B:0}, lives:{A:0,B:0}, passed:{A:false,B:false}, weather:{A:[],B:[]}, weathered_rows:{A:[],B:[]}, row_effects:{A:{},B:{}}, deck_left:{A:0,B:0}, grave_size:{A:0,B:0}};
    var m = D.meta || {};
    var fa = (m.factions||{}).A || '?', fb = (m.factions||{}).B || '?';
    // název modelu se nezobrazuje (Jakub 31. 10. 2026) — jen A/B štítek + balíček
    var da = ((m.decks||{}).A||{}).name || '', db_ = ((m.decks||{}).B||{}).name || '';
    var pa = da || 'A', pb = db_ || 'B';
    var html = '';
    html += '<div class="scorebar">';
    html += '<div class="names"><span class="sidechip">A</span><b style="color:'+(FACC[fa]||'#ccc')+'">'+esc(pa)+' ['+esc(FACL[fa]||fa)+']</b>'
         + '<br><span class="meta">velitel: '+leaderTxt(sn,'A')+'</span>'
         + ' &nbsp;životy <span class="sidechip">A</span>'+livesHtml(sn.lives.A)
         + (sn.passed.A?' <span class="meta">(pas)</span>':'')+'</div>';
    html += '<div><span class="big">'+sn.score.A+'</span> : <span class="big">'+sn.score.B+'</span></div>';
    html += '<div class="names" style="text-align:right">'+(sn.passed.B?'<span class="meta">(pas)</span> ':'')
         + 'životy <span class="sidechip">B</span>'+livesHtml(sn.lives.B)+' <span class="sidechip">B</span><b style="color:'+(FACC[fb]||'#ccc')+'">['+esc(FACL[fb]||fb)+'] '+esc(pb)+'</b>'
         + '<br><span class="meta">velitel: '+leaderTxt(sn,'B')+'</span></div>';
    html += '</div>';

    // side A rows (top), then B (bottom) — Jakub: hráč A nahoře
    ['A','B'].forEach(function(side){
      var fac = side==='A'?fa:fb;
      html += '<div class="sidebox">';
      html += '<div class="hdr"><span><span class="sidechip">'+side+'</span>'+esc(side==='A'?pa:pb)+' — '+esc(FACL[fac]||fac)+'</span><span>kolo '+curRound()+'</span></div>';
      ROWS.forEach(function(r){
        var cards = (sn.board[side]||{})[r] || [];
        var wr = ((sn.weathered_rows||{})[side]||[]);
        var weatherMark = wr.indexOf(r)>=0 ? '<span class="rweath">⛈</span>' : '';
        var reEffs = ((sn.row_effects||{})[side]||{})[r] || [];
        if (reEffs.indexOf('krvavy_mesic')>=0) weatherMark += '<span class="rweath" title="Krvavý měsíc — vypíná schopnosti jednotek v řadě (šílenství)">🌙</span>';
        if (reEffs.indexOf('lezak')>=0) weatherMark += '<span class="rweath" title="Mahakamský ležák — zdvojnásobí sílu řady">🍺</span>';
        var rs = cards.reduce(function(s,c){return s+(typeof c.eff==='number'?c.eff:0);},0);
        html += '<div class="rowline"><span class="rname">'+esc(ROWECS[r]||r)+'</span>'+weatherMark
             + '<span class="cards">'+cards.map(function(c){return cpill(c, false, true, side, r);}).join('')+'</span>'
             + '<span class="rscore">'+rs+'</span></div>';
      });
      // hand of this side (hidden in A/B perspective unless it is the viewer)
      var hand = ((sn.hand||{})[side]) || [];
      var showHand = persp==='god' || persp===side;
      html += '<div class="rowline"><span class="rname">ruka</span><span class="cards">'
           + (showHand ? hand.map(function(n){return cpill({name:n});}).join('')
                        : hand.map(function(){return cpill(null,true);}).join(''))
           + '</span><span class="rscore meta">'+(((sn.deck_left||{})[side]==null)?'—':(sn.deck_left||{})[side])+' v balíku</span></div>';
      // graveyard of this side — full content only from full replays (new snapshot.grave);
      // parsed old runs know only grave_size; hidden cards stay backs in A/B perspective
      var grave = ((sn.grave||{})[side]) || null;
      var gsize = ((sn.grave_size||{})[side]);
      var gcount = (grave!=null) ? grave.length : gsize;
      var gShow = persp==='god' || persp===side;
      html += '<div class="rowline"><span class="rname">pohřeb.</span>'
           + '<span class="cards">'
           + (grave!=null
                ? (gShow ? grave.map(function(n){return cpill({name:n});}).join('')
                         : grave.map(function(){return cpill(null,true);}).join(''))
                : (gShow ? '<span class="meta">obsah není v tomto záznamu dostupný</span>' : ''))
           + '</span>'
           + '<span class="rscore meta">'+(gcount==null?'—':gcount)+' v hrobě</span></div>';
      html += '</div>';
    });

    html += '<div class="ctrls">';
    html += '<button id="b-first">◀◀</button><button id="b-prev">◀</button>'
         + '<button id="b-next">▶</button><button id="b-last">▶▶</button>'
         + '<button id="b-play">▷ autoplay</button>';
    html += '<div class="tl" id="tl"><div class="knob" id="knob"></div></div>';
    html += '<span class="meta" id="pos"></span>';
    html += '<span class="persp">pohled: '
         + ['god','A','B'].map(function(p){return '<button class="pbtn'+(persp===p?' on':'')+'" data-p="'+p+'">'+(p==='god'?'oboji':p)+'</button>';}).join(' ')
         + '</span>';
    html += '</div>';

    html += '<div class="log" id="log"></div>';
    root.innerHTML = html;

    // timeline ticks: round boundaries
    var tl = document.getElementById('tl');
    ts.forEach(function(i, idx){
      var evs = evByT[i] || [];
      if (evs.some(function(ev){return ev.type==='round_end'||ev.type==='round_start'||ev.type==='round_setup';})) {
        var d = document.createElement('div'); d.className='tick';
        d.style.left = (100*idx/(ts.length-1||1))+'%';
        tl.appendChild(d);
      }
    });
    document.getElementById('knob').style.left = (100*T/(ts.length-1||1))+'%';
    document.getElementById('pos').textContent = 'krok '+(T+1)+'/'+ts.length;

    // log window: events of the current step (+ a bit of context before)
    var logEl = document.getElementById('log');
    var from = Math.max(0, T-6);
    var lines = [];
    for (var i=from; i<=T && i<ts.length; i++) {
      (evByT[ts[i]]||[]).forEach(function(ev, ei, arr){
        if (ev.type === 'draw' && ev.mull) return;   // náhrada za přelíznutí: je v textu mulliganu
        // dedup: 'deploy' přímo po 'turn' se stejnou kartou na vlastní stranu
        // je stejná informace jako řádek 'hraje: ...' — přeskoč ho (deploy ze záloh
        // apod. nemá předcházející turn a zůstává vidět)
        if (ev.type === 'deploy' && ei > 0) {
          var prev = arr[ei-1];
          if (prev.type === 'turn' && prev.action === 'play' && prev.card === ev.card
              && (!ev.to_side || ev.to_side === ev.side)) return;
        }
        var line = evText(ev);
        if (line) lines.push('<div class="'+(i===T?'cur':'')+(ev.type==='round_end'?' roundend':'')+'">'+line+'</div>');
      });
    }
    logEl.innerHTML = lines.join('') || '<div>(začátek)</div>';
    logEl.scrollTop = logEl.scrollHeight;

    document.getElementById('b-first').onclick = function(){ T=0; render(); };
    document.getElementById('b-prev').onclick = function(){ if(T>0){T--; render();} };
    document.getElementById('b-next').onclick = function(){ if(T<ts.length-1){T++; render();} };
    document.getElementById('b-last').onclick = function(){ T=ts.length-1; render(); };
    document.getElementById('b-play').onclick = togglePlay;
    tl.onclick = function(ev){
      var r = tl.getBoundingClientRect();
      var frac = (ev.clientX-r.left)/r.width;
      T = Math.max(0, Math.min(ts.length-1, Math.round(frac*(ts.length-1))));
      render();
    };
    Array.prototype.forEach.call(document.querySelectorAll('.pbtn'), function(b){
      b.onclick = function(){ persp = b.dataset.p; render(); };
    });
  }

  function leaderTxt(sn, side) {
    var nm = ((sn.leader||{})[side]);
    if (!nm) return '— (neznámý v tomto záznamu)';
    var used = (sn.leader_used||{})[side];
    return esc(nm) + (used ? ' <span style="color:var(--muted)">✓ použit</span>'
                            : ' <span style="color:var(--good)">✓ k dispozici</span>');
  }
  function livesHtml(n) {
    var out = '';
    for (var i=0;i<2;i++) out += i<n ? '<span style="color:var(--gold)">●</span>' : '<span style="color:#555">●</span>';
    return out;
  }
  function curRound() {
    for (var i=T;i>=0;i--) {
      var evs = evByT[ts[i]]||[];
      for (var j=0;j<evs.length;j++) if (evs[j].round) return evs[j].round;
    }
    return 1;
  }
  function evText(ev) {
    var s = ev.side ? '['+ev.side+'] ' : '';
    switch (ev.type) {
      case 'turn': return s+'hraje: '+esc(ev.action)+(ev.card?' '+esc(ev.card):'')+(ev.row?' → '+esc(ROWECS[ev.row]||ev.row):'')
        + (ev.llm ? ' <span class="'+(ev.llm.picked?'llm':'drv')+'" title="'+(ev.llm.picked?'vybralo LLM':'vybral driver (rollout)')
          +(ev.llm.plan&&ev.llm.plan.length&&!ev.llm.picked?' — LLM chtěl: '+esc(ev.llm.plan.map(function(p){return (p.card||p.action||'')+(p.args&&p.args.length?'→'+p.args[0]:'')+(p.target?' ('+p.target+')':'');}).join(', ')):'')
          +(ev.llm.reason?' — '+esc(ev.llm.reason):'')
          +(ev.llm.rollouts&&ev.llm.rollouts.length?' | rollouty: '+esc(ev.llm.rollouts.map(function(r){return (r.act||'')+' '+(r.score!=null?r.score.toFixed(1):'?');}).join(', ')):'')+'">'+(ev.llm.picked?'🤖 LLM':'⚙️ driver')+'</span>' : '');
      case 'action': return s+'akce: '+esc(ev.action||'')+(ev.card?' '+esc(ev.card):'');
      case 'attempt': return s+'zkouší: '+esc(ev.action||'')+(ev.card?' '+esc(ev.card):'');
      case 'deploy': return s+'vynáší '+(ev.card?esc(ev.card):'?')+(ev.power!=null?' ('+ev.power+')':'')+' → '+(ev.to_side&&ev.to_side!==ev.side?'strana '+ev.to_side+' ':'')+esc(ROWECS[ev.row]||ev.row||'');
      case 'draw': return s+'líže '+esc(ev.card);
      case 'mulligan': return s+'přelíznutí: '+(ev.picked&&ev.picked.length?esc(ev.picked.join(', ')):'nic')
        +(ev.drawn&&ev.drawn.length?' → líznuto: '+esc(ev.drawn.join(', ')):(ev.picked&&ev.picked.length?' → balíček prázdný, nelze líznout':''))
        +(ev.reason?' <span class="llm" title="'+esc(ev.reason)+'">🤖 '+esc(ev.reason)+'</span>':'');
      case 'pass': return s+'pas';
      case 'skip': return s+'přeskočil tah (ST pasivka)';
      case 'discard': return s+'odhazuje '+esc(ev.card||'');
      case 'leader': return s+'velitel '+esc(ev.leader||'');
      case 'weather': return s+'počasí '+esc(ev.card||'');
      case 'destroy': return (ev.why === 'sežrání' ? '🦴 sežrá ' : 'ničí ')+esc(ev.target||'')+(ev.why && ev.why !== 'sežrání' ?' ('+esc(ev.why)+')':'');
      case 'steal': return 'přebírá '+esc(ev.target||'')+' na stranu '+esc(ev.to_side||'');
      case 'remove': return esc(ev.target||'')+' opouští bojiště';
      case 'negate': return s+'karta odmítnuta („Nechci, nechci!")';
      case 'quen_block': return esc(ev.target||'')+' chráněn Quen';
      case 'illegal': return s+'<span style="color:var(--bad)">nelegální: '+esc(ev.error||'')+'</span>';
      case 'keep': return '['+ev.side+'] '+esc(ev.card)+' zůstává na bojišti ('+esc(ev.why||'')+')';
      case 'round_start': return '== KOLO '+(ev.round||'?')+' ==';
      case 'round_setup': return '== KOLO '+(ev.round||'?')+' — nové karty ==';
      case 'round_end': return '== KONEC KOLA '+(ev.round||'?')+' '+scoreTxt(ev)+' ==';
      case 'game_start': return '== start hry ==';
      case 'game_end': return '== KONEC: vítěz '+(ev.winner?ev.winner:'— (remíza)')+' ==';
      case 'spec': return s+'<span style="color:var(--good)">✦ '+esc(ev.text||'')+'</span>';
      case 'note': return esc(ev.text||'');
      default: return s+esc(ev.type);
    }
  }
  function scoreTxt(ev) {
    if (!ev.score) return '';
    return '(A '+ev.score.A+' : '+ev.score.B+' B)';
  }

  var playTimer = null;
  function togglePlay() {
    if (playTimer) {
      clearInterval(playTimer); playTimer = null;
      document.getElementById('b-play').textContent = '▷ autoplay';
      document.getElementById('b-play').classList.remove('on');
    } else {
      document.getElementById('b-play').textContent = '❚❚ pauza';
      document.getElementById('b-play').classList.add('on');
      playTimer = setInterval(function(){
        if (T < ts.length-1) { T++; render(); }
        else { togglePlay(); }
      }, 1200);
    }
  }

  document.addEventListener('keydown', function(ev){
    if (ev.key === 'ArrowLeft') { if (T>0){T--; render();} }
    else if (ev.key === 'ArrowRight') { if (T<ts.length-1){T++; render();} }
  });

  var FACC = {"SO": "#b8342f", "SK": "#c89b3c", "NG": "#3f6296", "ST": "#4e7a3f", "ZA": "#a8834b", "MO": "#7a2fa0"};
  var FACL = {"SO": "Skellige", "SK": "Severn\u00ed kr\u00e1lovstv\u00ed", "NG": "Nilfgaard", "ST": "Scoia'tael", "ZA": "Zakl\u00edna\u010di", "MO": "Monstra"};
  var ROWS = ["oblehani", "stredni", "predni"];
  var ROWECS = {"predni": "p\u0159edn\u00ed", "stredni": "st\u0159edn\u00ed", "oblehani": "obl\u00e9hac\u00ed"};
  render();
})();
</script>
</body>
</html>
